server:
  port: 9001

spring:
  application:
    name: employee-mcp-server
  ai:
    mcp:
      server:
        name: employee-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: 提供企业员工排班查询工具
        request-timeout: 20s
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s
          disallow-delete: false
    alibaba:
      mcp:
        nacos:
          server-addr: ${NACOS_ADDRESS:127.0.0.1:8848}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          register:
            enabled: true
            service-group: mcp-server
            service-name: employee-mcp-server
            # 本地联调固定注册地址，避免局域网地址被系统 HTTP 代理转发。
            # 部署到其他机器时通过环境变量改成服务端可访问的地址。
            host: ${NACOS_MCP_SERVER_HOST:127.0.0.1}
            port: ${NACOS_MCP_SERVER_PORT:9001}
