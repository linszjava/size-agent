spring:
  application:
    name: spring-ai-alibaba-core-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/size_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:size_ai}
    password: ${MYSQL_PASSWORD:SizeAi@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always   # 生产环境 修改为never

    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:qwen3.8-max-0902}
          # Qwen3.8 Max 使用多模态接口，即使请求只包含文本。
          multi-model: true
          temperature: 0.7
      base-url: https://llm-7gno6a71gk4wf1gh.cn-beijing.maas.aliyuncs.com
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
    vectorstore:
      redis:
        initialize-schema: true
        index-name: ${REDIS_VECTOR_INDEX:knowledge-index}
        prefix: ${REDIS_VECTOR_PREFIX:knowledge:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:redis}
      password: ${REDIS_PASSWORD:redis}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  ai:
    system-prompt: 你是一个严谨的中文 AI 助手。回答应准确、简洁；不知道时明确说明不知道。
    engineering:
      # AI 请求的统一工程预算，具体客户端和 Agent 仍应设置各自的超时与轮数。
      request-timeout: ${AI_REQUEST_TIMEOUT:30s}
      max-input-characters: ${AI_MAX_INPUT_CHARACTERS:4000}
      max-agent-rounds: ${AI_MAX_AGENT_ROUNDS:8}
      max-rag-results: ${AI_MAX_RAG_RESULTS:5}

management:
  endpoints:
    web:
      # 只开放必要端点，避免 env、configprops 等端点泄露配置。
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8888
